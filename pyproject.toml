[project]
name = "bpmn-generator"
version = "0.4.0"
description = "Generate BPMN 2.0 diagrams from coordinate-free YAML briefs, with well-formedness rules and an id convention."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Dinh", email = "25410291@ms.uit.edu.vn" }]
keywords = ["bpmn", "process", "diagram", "business-analysis", "yaml"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
bpmn-brief = "bpmn_generator.brief:main"
bpmn-lint = "bpmn_generator.lint:main"
bpmn-id = "bpmn_generator.ids:main"
bpmn2yaml = "bpmn_generator.convert:main"
bpmn-rotate = "bpmn_generator.rotate:main"

[project.urls]
Repository = "https://github.com/sam-uit/bpmn-generator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmn_generator"]
